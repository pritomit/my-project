name: Auto-Clean Live Streams

on:
  schedule:
    # Run every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Stream Validator
        run: |
          cd GlobalTv
          node scripts/check-streams.mjs

      - name: Commit and Push Updated Streams
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add GlobalTv/fallback.m3u
          if git diff --staged --quiet; then
            echo "No stream updates required."
          else
            git commit -m "chore(streams): auto-update live streams [skip ci]"
            git push
          fi
